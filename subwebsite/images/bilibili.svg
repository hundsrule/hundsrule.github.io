<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="50%" stop-color="#1f1822" />
      <stop offset="100%" stop-color="#111113" />
    </linearGradient>

    <!-- Bili Pink Gradient -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7299" />
      <stop offset="100%" stop-color="#ff5388" />
    </linearGradient>

    <!-- Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00aeec" />
      <stop offset="100%" stop-color="#008ac5" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Subtle grid lines & particles -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Background Ambient Glow -->
  <circle cx="280" cy="220" r="180" fill="#fb7299" opacity="0.18" filter="url(#pinkGlow)" />
  <circle cx="580" cy="280" r="150" fill="#00aeec" opacity="0.12" filter="url(#pinkGlow)" />

  <!-- Simulated Phone Frame in 3D Angle -->
  <g transform="translate(480, 70)" filter="url(#shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="240" height="380" rx="36" fill="#1e1e24" stroke="#33333d" stroke-width="4" />
    <!-- Screen -->
    <rect x="10" y="10" width="220" height="360" rx="28" fill="#ffffff" />
    
    <!-- Phone Screen Mockup Header -->
    <rect x="10" y="10" width="220" height="24" rx="10" fill="#f8f9fa" />
    <circle cx="120" cy="22" r="5" fill="#000000" />

    <!-- Video Area Mockup -->
    <rect x="10" y="34" width="220" height="95" fill="#141419" />
    <circle cx="120" cy="81" r="18" fill="rgba(251,114,153,0.9)" />
    <polygon points="116,74 128,81 116,88" fill="#ffffff" />

    <!-- Tab Bar -->
    <rect x="10" y="129" width="220" height="22" fill="#ffffff" />
    <text x="32" y="145" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#999999">简介</text>
    <text x="70" y="145" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#fb7299">评论 4298</text>
    <line x1="70" y1="149" x2="118" y2="149" stroke="#fb7299" stroke-width="2" stroke-linecap="round" />

    <!-- Comment Card 1 (Pinned) -->
    <g transform="translate(20, 160)">
      <circle cx="14" cy="14" r="12" fill="#fb7299" />
      <text x="14" y="18" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">UP</text>
      <!-- Name & Badge -->
      <text x="34" y="12" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" fill="#fb7299">野生UP主</text>
      <rect x="85" y="4" width="22" height="10" rx="2" fill="#fb7299" />
      <text x="96" y="12" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">LV6</text>
      <!-- Content -->
      <text x="34" y="24" font-family="-apple-system, sans-serif" font-size="8" fill="#333333">【置顶】感谢大家的三连！</text>
      <text x="34" y="34" font-family="-apple-system, sans-serif" font-size="7" fill="#999999">3小时前 · 广东  ❤️UP主觉得很赞</text>
    </g>

    <!-- Comment Card 2 -->
    <g transform="translate(20, 206)">
      <circle cx="14" cy="14" r="12" fill="#00aeec" />
      <text x="14" y="18" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">22</text>
      <text x="34" y="12" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" fill="#333333">吃瓜群众</text>
      <rect x="76" y="4" width="20" height="10" rx="2" fill="#ff7f3f" />
      <text x="86" y="12" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">LV5</text>
      <text x="34" y="24" font-family="-apple-system, sans-serif" font-size="8" fill="#333333">这也太逼真了，神还原！👍</text>
      <!-- Reply Box -->
      <rect x="34" y="30" width="160" height="28" rx="4" fill="#f4f5f7" />
      <text x="40" y="42" font-family="-apple-system, sans-serif" font-size="7" fill="#666666"><tspan font-weight="bold">网友A</tspan>: 连点赞都带弹跳动画！</text>
      <text x="40" y="52" font-family="-apple-system, sans-serif" font-size="7" fill="#008ac5">共 18 条回复 &gt;</text>
    </g>

    <!-- Comment Card 3 -->
    <g transform="translate(20, 274)">
      <circle cx="14" cy="14" r="12" fill="#48bb78" />
      <text x="34" y="12" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" fill="#333333">科技课代表</text>
      <text x="34" y="24" font-family="-apple-system, sans-serif" font-size="8" fill="#333333">支持一键长截图导出[妙赞]</text>
    </g>

    <!-- Bottom Input Bar Mockup -->
    <rect x="10" y="332" width="220" height="38" fill="#ffffff" stroke="#eeeeee" stroke-width="1" />
    <rect x="22" y="340" width="150" height="22" rx="11" fill="#f1f2f3" />
    <text x="34" y="354" font-family="-apple-system, sans-serif" font-size="8" fill="#999999">发一条友善的评论吧...</text>
    <circle cx="186" cy="351" r="7" fill="#fb7299" opacity="0.15" />
    <circle cx="206" cy="351" r="7" fill="#00aeec" opacity="0.15" />
  </g>

  <!-- Left Main Visual & Title Area -->
  <g transform="translate(70, 110)">
    <!-- Bilibili TV Mascot Illustration -->
    <g transform="translate(0, 0)">
      <!-- Antennas -->
      <line x1="38" y1="16" x2="16" y2="0" stroke="#fb7299" stroke-width="6" stroke-linecap="round" />
      <circle cx="14" cy="0" r="4" fill="#fb7299" />
      <line x1="82" y1="16" x2="104" y2="0" stroke="#fb7299" stroke-width="6" stroke-linecap="round" />
      <circle cx="106" cy="0" r="4" fill="#fb7299" />

      <!-- TV Screen Outer -->
      <rect x="0" y="16" width="120" height="88" rx="20" fill="url(#pinkGrad)" filter="url(#shadow)" />
      <!-- TV Screen Inner -->
      <rect x="12" y="26" width="96" height="68" rx="14" fill="#ffffff" />
      <!-- Eyes & Smile -->
      <circle cx="38" cy="56" r="6" fill="#141416" />
      <circle cx="82" cy="56" r="6" fill="#141416" />
      <path d="M 50 68 Q 60 76 70 68" stroke="#141416" stroke-width="3" fill="none" stroke-linecap="round" />
      <!-- Cheeks -->
      <ellipse cx="28" cy="64" rx="5" ry="3" fill="#ffb4ca" />
      <ellipse cx="92" cy="64" rx="5" ry="3" fill="#ffb4ca" />
    </g>

    <!-- Floating Badge -->
    <g transform="translate(140, 28)">
      <rect x="0" y="0" width="115" height="26" rx="13" fill="#fb7299" opacity="0.2" stroke="#fb7299" stroke-width="1.5" />
      <text x="57" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#fb7299" text-anchor="middle" letter-spacing="1">BILIBILI SIMULATOR</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      B站移动端评论区
    </text>
    <text x="0" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="36" font-weight="900" fill="url(#pinkGrad)" letter-spacing="-0.5">
      超拟真生成器
    </text>

    <!-- Subtitle / Feature Points -->
    <g transform="translate(0, 235)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#fb7299" />
        <path d="M5 9 L8 12 L13 6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="26" y="14" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">可视化点击任意编辑</text>
      </g>
      <!-- Feature 2 -->
      <g transform="translate(170, 0)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#00aeec" />
        <path d="M5 9 L8 12 L13 6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="26" y="14" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">像素级拟真点赞动效</text>
      </g>
      <!-- Feature 3 -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#48bb78" />
        <path d="M5 9 L8 12 L13 6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="26" y="14" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">一键导出高清无水印长图</text>
      </g>
    </g>
  </g>
</svg>
