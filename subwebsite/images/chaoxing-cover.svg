<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="45%" stop-color="#0052CC"/>
      <stop offset="100%" stop-color="#0B1930"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Decorative circles / grid pattern -->
  <circle cx="700" cy="80" r="180" fill="#0084ff" opacity="0.15" filter="url(#glow)"/>
  <circle cx="100" cy="420" r="140" fill="#00c0ff" opacity="0.12"/>
  
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Left Content: Texts -->
  <g transform="translate(60, 110)">
    <!-- Chaoxing Red Star Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="34" rx="17" fill="#ffffff" opacity="0.95"/>
      <circle cx="17" cy="17" r="10" fill="#E60012"/>
      <path d="M17 11 L19 15 L23 15.5 L20 18.5 L21 23 L17 20.5 L13 23 L14 18.5 L11 15.5 L15 15 Z" fill="#ffffff" transform="scale(0.85) translate(3, 3)"/>
      <text x="36" y="22" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" font-size="14" fill="#0052cc">超星学习通</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'PingFang SC', 'Noto Sans SC', sans-serif" font-weight="900" font-size="40" fill="#ffffff" letter-spacing="1">视频讨论区</text>
    <text x="0" y="132" font-family="'PingFang SC', 'Noto Sans SC', sans-serif" font-weight="900" font-size="34" fill="#FFD13B" letter-spacing="1">逼真生成模拟器</text>

    <!-- Subtitle -->
    <text x="0" y="176" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#e0e8ff" opacity="0.9">100% 像素级复刻 · 可视化交互编辑</text>
    <text x="0" y="202" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#a8c5ff" opacity="0.8">支持点赞/评论/打卡/状态栏/导出独立HTML</text>

    <!-- Tags -->
    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="85" height="28" rx="6" fill="#ffffff" opacity="0.2"/>
      <text x="12" y="19" font-family="'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#ffffff">任务点已完成</text>

      <rect x="95" y="0" width="85" height="28" rx="6" fill="#ffffff" opacity="0.2"/>
      <text x="107" y="19" font-family="'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#ffffff">所见即所得</text>

      <rect x="190" y="0" width="70" height="28" rx="6" fill="#FF4D4F" opacity="0.85"/>
      <text x="202" y="19" font-family="'PingFang SC', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">高保真拟真</text>
    </g>
  </g>

  <!-- Right Mockup: Simulated Mobile Screen with Comments -->
  <g transform="translate(470, 45)" filter="url(#dropShadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="270" height="410" rx="30" fill="#ffffff" stroke="#334155" stroke-width="4"/>
    
    <!-- Phone Screen Clip -->
    <g clip-path="url(#phoneClip)">
      <clipPath id="phoneClip">
        <rect x="4" y="4" width="262" height="402" rx="26"/>
      </clipPath>

      <!-- Status Bar -->
      <rect x="4" y="4" width="262" height="24" fill="#000000"/>
      <text x="24" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">14:32</text>
      <!-- Battery & Wifi -->
      <rect x="230" y="11" width="16" height="8" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
      <rect x="232" y="13" width="10" height="4" fill="#52c41a"/>

      <!-- Video Player View -->
      <rect x="4" y="28" width="262" height="135" fill="url(#screenGrad)"/>
      <!-- Video Content PPT slide mock -->
      <rect x="24" y="44" width="222" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="36" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#60a5fa">§ 2.4 微积分基本定理推导</text>
      <line x1="36" y1="75" x2="200" y2="75" stroke="#38bdf8" stroke-width="2"/>
      <text x="36" y="92" font-family="sans-serif" font-size="9" fill="#94a3b8">∫[a,b] f(x)dx = F(b) - F(a)</text>
      <text x="36" y="108" font-family="sans-serif" font-size="8" fill="#e2e8f0">重点提示：牛顿-莱布尼茨公式 ★★★</text>
      
      <!-- Video Play Overlay / Progress -->
      <circle cx="135" cy="90" r="16" fill="#000000" opacity="0.6"/>
      <polygon points="131,82 143,90 131,98" fill="#ffffff"/>
      <rect x="4" y="159" width="262" height="4" fill="#334155"/>
      <rect x="4" y="159" width="120" height="4" fill="#0084ff"/>
      <circle cx="124" cy="161" r="4" fill="#ffffff"/>

      <!-- Task bar -->
      <rect x="4" y="163" width="262" height="26" fill="#f0fdf4" stroke="#dcfce7" stroke-width="1"/>
      <circle cx="18" cy="176" r="6" fill="#22c55e"/>
      <path d="M15 176 L17 178 L21 174" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <text x="28" y="180" font-family="sans-serif" font-size="10" font-weight="bold" fill="#15803d">任务点：视频任务（已完成）</text>

      <!-- Tabs -->
      <rect x="4" y="189" width="262" height="30" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
      <text x="25" y="209" font-family="sans-serif" font-size="11" fill="#64748b">详情</text>
      <text x="65" y="209" font-family="sans-serif" font-size="11" fill="#64748b">目录</text>
      <text x="115" y="209" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0084ff">讨论(128)</text>
      <line x1="115" y1="218" x2="155" y2="218" stroke="#0084ff" stroke-width="2"/>
      <text x="180" y="209" font-family="sans-serif" font-size="11" fill="#64748b">提问</text>

      <!-- Comments Stream -->
      <!-- Comment 1 -->
      <rect x="4" y="220" width="262" height="66" fill="#ffffff"/>
      <circle cx="24" cy="238" r="13" fill="#ff7d00"/>
      <text x="19" y="243" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">张</text>
      <text x="44" y="235" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">张伟</text>
      <rect x="74" y="225" width="28" height="13" rx="3" fill="#e0f2fe"/>
      <text x="78" y="235" font-family="sans-serif" font-size="8" fill="#0284c7">学生</text>
      <text x="44" y="252" font-family="sans-serif" font-size="10" fill="#334155">老师讲得太清晰了！已打卡！</text>
      <text x="44" y="267" font-family="sans-serif" font-size="9" fill="#94a3b8">2小时前 · 江苏</text>
      <text x="225" y="238" font-family="sans-serif" font-size="10" fill="#64748b">👍 68</text>
      <line x1="14" y1="286" x2="256" y2="286" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Comment 2 -->
      <rect x="4" y="287" width="262" height="74" fill="#ffffff"/>
      <circle cx="24" cy="305" r="13" fill="#00b578"/>
      <text x="19" y="310" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">陈</text>
      <text x="44" y="302" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">陈老师 (助教)</text>
      <rect x="110" y="292" width="28" height="13" rx="3" fill="#fef3c7"/>
      <text x="114" y="302" font-family="sans-serif" font-size="8" fill="#d97706">助教</text>
      <text x="44" y="319" font-family="sans-serif" font-size="10" fill="#334155">大家注意看08:20的公式变换，期末必考</text>
      <text x="44" y="334" font-family="sans-serif" font-size="9" fill="#94a3b8">4小时前 · 北京</text>
      <text x="220" y="305" font-family="sans-serif" font-size="10" fill="#0084ff">👍 342</text>
      <line x1="14" y1="361" x2="256" y2="361" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Bottom Chat Bar -->
      <rect x="4" y="365" width="262" height="40" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
      <rect x="16" y="371" width="170" height="28" rx="14" fill="#f1f5f9"/>
      <text x="30" y="389" font-family="sans-serif" font-size="10" fill="#94a3b8">说点什么吧...</text>
      <circle cx="205" cy="385" r="9" fill="#eff6ff"/>
      <text x="200" y="389" font-family="sans-serif" font-size="11">😊</text>
      <rect x="225" y="373" width="34" height="24" rx="12" fill="#0084ff"/>
      <text x="232" y="388" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">发送</text>
    </g>
  </g>
</svg>
