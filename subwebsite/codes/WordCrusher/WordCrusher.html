    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a0a;
            color: #fff;
            font-family: var(--font-sans);
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        #gameArea {
            width: 100vw;
            height: calc(100vh - 54px);
            position: relative;
            overflow: hidden;
            background-image: url('assets/images/background.jpeg');
            background-size: cover;
            background-position: center;
        }

        #gameArea::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(16, 16, 16, 0.45);
            pointer-events: none;
        }

        /* Top HUD Bar */
        #gameStats {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(16, 16, 16, 0.9);
            border: 2px solid #ffffff;
            box-shadow: 4px 4px 0px 0px var(--phantom-red);
            padding: 8px 18px;
            z-index: 100;
            width: 90%;
            max-width: 750px;
            text-align: center;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .stats-grid {
            display: flex;
            justify-content: space-around;
            margin-top: 6px;
            font-family: var(--font-display);
            font-size: 15px;
            color: var(--phantom-white);
        }

        .stats-grid span {
            color: var(--phantom-red);
        }

        /* Player Sprite */
        #player {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background-image: url('assets/images/player.jpg');
            background-size: cover;
            background-position: center;
            border: 3px solid var(--phantom-red);
            box-shadow: 0 0 15px var(--phantom-red);
            z-index: 100;
            border-radius: 8px;
        }

        /* Enemy Styling (P5 Target Card) */
        .enemy {
            position: absolute;
            padding: 8px 16px;
            background: var(--phantom-black);
            color: #ffffff;
            border: 3px solid var(--phantom-red);
            box-shadow: 4px 4px 0px 0px #000000;
            transform: skewX(-8deg);
            font-family: var(--font-display);
            font-size: 24px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            white-space: nowrap;
            transition: top 2s linear;
        }

        .enemy.matching {
            background: #ffffff;
            color: var(--phantom-black);
            border-color: #000000;
            box-shadow: 5px 5px 0px 0px var(--phantom-red);
            transform: skewX(-8deg) scale(1.08);
        }

        .enemy.hit {
            animation: p5Hit 0.3s forwards;
        }

        @keyframes p5Hit {
            0% { transform: skewX(-8deg) scale(1); }
            50% { transform: skewX(-8deg) scale(1.4) rotate(5deg); background: var(--phantom-red); color: #fff; }
            100% { transform: skewX(-8deg) scale(0); opacity: 0; }
        }

        /* HP Bar */
        #healthWrap {
            position: absolute;
            top: 90px;
            left: 20px;
            z-index: 100;
            background: var(--phantom-black);
            border: 2px solid #ffffff;
            box-shadow: 4px 4px 0px 0px var(--phantom-red);
            padding: 6px 12px;
            transform: skewX(-10deg);
        }

        .hp-label {
            font-family: var(--font-display);
            font-size: 13px;
            margin-bottom: 4px;
            color: #fff;
        }

        #health {
            width: 160px;
            height: 14px;
            background: #2a2a2a;
            border: 1px solid #fff;
            overflow: hidden;
        }

        #healthBar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff1a1a, var(--phantom-red));
            transition: width 0.3s ease;
        }

        /* Left side Game Stats */
        .game-badge {
            position: absolute;
            z-index: 100;
            background: var(--phantom-black);
            border: 2px solid #ffffff;
            box-shadow: 4px 4px 0px 0px var(--phantom-red);
            padding: 6px 14px;
            font-family: var(--font-display);
            font-size: 18px;
            transform: skewX(-10deg);
        }

        #scoreBadge {
            top: 90px;
            right: 20px;
        }

        #comboBadge {
            top: 140px;
            right: 20px;
            color: #ffeb3b;
        }

        #levelBadge {
            top: 150px;
            left: 20px;
        }

        /* Bottom Input */
        #inputArea {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 420px;
            text-align: center;
            font-family: var(--font-display);
            font-size: 26px;
            letter-spacing: 2px;
            padding: 10px 16px;
            border: 3px solid #ffffff;
            background: rgba(16, 16, 16, 0.95);
            color: #ffffff;
            box-shadow: 6px 6px 0px 0px var(--phantom-red);
            outline: none;
            z-index: 100;
            text-transform: lowercase;
        }

        #inputArea:focus {
            border-color: var(--phantom-red);
            box-shadow: 8px 8px 0px 0px #ffffff;
        }

        #inputArea.correct {
            background: rgba(34, 197, 94, 0.9) !important;
            border-color: #ffffff !important;
        }

        #inputArea.wrong {
            background: rgba(230, 0, 18, 0.8) !important;
            border-color: #ffffff !important;
        }

        /* Overlay */
        #pauseOverlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(16, 16, 16, 0.95);
            border: 4px solid #ffffff;
            box-shadow: 10px 10px 0px 0px var(--phantom-red);
            padding: 30px 40px;
            font-family: var(--font-display);
            font-size: 28px;
            color: #ffffff;
            z-index: 1000;
            text-align: center;
            letter-spacing: 2px;
            max-width: 90%;
        }
    </style>

        let enemies = [];
        let gameSpeed = 2000;
        let enemyCount = 2;
        let health = 100;
        let isPaused = false;
        let wordsNeeded = 5;
        let wordsDestroyed = 0;
        let speedIncrease = 400;
        let currentTransitionDuration = 4;
        let bgmStarted = false;

        let availableWords = [...words];
        let usedWords = new Set();

        function getRandomWord() {
            if (availableWords.length === 0) {
                availableWords = words.filter(word => !usedWords.has(word));
                if (availableWords.length === 0) {
                    availableWords = [...words];
                }
            }
            const randomIndex = Math.floor(Math.random() * availableWords.length);
            const word = availableWords[randomIndex];
            availableWords.splice(randomIndex, 1);
            usedWords.add(word);
            return word;
        }

        function pauseGame(duration = null, message = 'PAUSED // 游戏暂停中...') {
            isPaused = true;
            const overlay = document.getElementById('pauseOverlay');
            overlay.textContent = message;
            overlay.style.display = 'block';

            enemies.forEach(enemy => {
                const currentTop = window.getComputedStyle(enemy).top;
                enemy.classList.add('paused');
                enemy.style.top = currentTop;
            });

            document.getElementById('inputArea').blur();

            if (duration) {
                setTimeout(() => {
                    resumeGame();
                }, duration);
            }
        }

        function resumeGame() {
            isPaused = false;
            document.getElementById('pauseOverlay').style.display = 'none';

            const gameAreaHeight = document.getElementById('gameArea').clientHeight;
            enemies.forEach(enemy => {
                enemy.classList.remove('paused');
                const currentTop = parseFloat(enemy.style.top);
                if (currentTop < gameAreaHeight) {
                    enemy.style.top = gameAreaHeight + 'px';
                }
            });

            document.getElementById('inputArea').focus();
            spawnEnemies();
        }

        function updateHealth(damage) {
            health = Math.max(0, health - damage);
            document.getElementById('healthBar').style.width = health + '%';
            if (health <= 0) {
                try { AUDIO.gameOver.play(); } catch(e) {}
                gameOver();
            }
        }

        function createEnemy() {
            if (isPaused) return;

            const enemy = document.createElement('div');
            enemy.className = 'enemy';

            const word = getRandomWord();
            enemy.textContent = word;
            enemy.dataset.word = word;

            const areaWidth = document.getElementById('gameArea').clientWidth;
            const areaHeight = document.getElementById('gameArea').clientHeight;
            const enemyLeft = Math.random() * (areaWidth - 140) + 20;

            enemy.style.left = enemyLeft + 'px';
            enemy.style.top = '0px';
            enemy.style.transition = `top ${currentTransitionDuration}s linear`;
            document.getElementById('gameArea').appendChild(enemy);
            enemies.push(enemy);

            setTimeout(() => {
                if (!isPaused) {
                    enemy.style.top = areaHeight + 'px';
                }
            }, 50);

            const releaseWord = () => {
                usedWords.delete(enemy.dataset.word);
            };

            enemy.addEventListener('transitionend', () => {
                if (parseFloat(enemy.style.top) >= areaHeight - 10) {
                    releaseWord();
                    enemy.remove();
                    enemies = enemies.filter(e => e !== enemy);
                    resetCombo();
                    try { AUDIO.wrong.play(); } catch(e) {}
                    updateHealth(20);
                    if (enemies.length === 0 && health > 0) {
                        nextLevel();
                    }
                }
            });
        }

        function updateCombo() {
            combo++;
            maxCombo = Math.max(maxCombo, combo);
            document.getElementById('comboText').textContent = combo;

            if (combo % 5 === 0) {
                health = Math.min(100, health + 5);
                document.getElementById('healthBar').style.width = health + '%';
            }
        }

        function resetCombo() {
            combo = 0;
            document.getElementById('comboText').textContent = '0';
        }

        function nextLevel() {
            level++;
            try { AUDIO.levelUp.play(); } catch(e) {}
            document.getElementById('level').textContent = level;

            gameSpeed = Math.max(1000, gameSpeed - speedIncrease);
            currentTransitionDuration = Math.max(1.2, currentTransitionDuration - 0.15);
            enemyCount = Math.min(8, enemyCount + 1);
            wordsNeeded = 8 + (level - 1) * 4;
            wordsDestroyed = 0;
            health = Math.min(100, health + 20);
            document.getElementById('healthBar').style.width = health + '%';

            pauseGame(1200, `STAGE ${level} // 关卡推进\nTARGET: 击破 ${wordsNeeded} 个词汇`);
        }

        function clearEnemyMatching() {
            enemies.forEach(e => e.classList.remove('matching'));
        }

        const input = document.getElementById('inputArea');
        input.addEventListener('input', (e) => {
            if (isPaused) return;

            const word = e.target.value.toLowerCase().trim();
            clearEnemyMatching();
            const enemy = enemies.find(e => e.dataset.word.startsWith(word));

            if (enemy) {
                input.className = 'correct';
                enemy.classList.add('matching');
                if (enemy.dataset.word === word) {
                    e.target.value = '';
                    input.className = '';

                    try { AUDIO.hit.play(); } catch(err) {}
                    enemy.classList.add('hit');
                    setTimeout(() => {
                        usedWords.delete(enemy.dataset.word);
                        enemy.remove();
                        enemies = enemies.filter(item => item !== enemy);
                        updateScore(10 * (combo + 1));
                        updateCombo();

                        wordsDestroyed++;
                        if (wordsDestroyed >= wordsNeeded) {
                            nextLevel();
                        }
                    }, 250);
                }
            } else {
                input.className = word ? 'wrong' : '';
            }
        });

        function spawnEnemies() {
            if (isPaused) return;
            if (enemies.length < enemyCount) {
                createEnemy();
            }
            setTimeout(spawnEnemies, gameSpeed);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (isPaused) {
                    resumeGame();
                } else {
                    pauseGame();
                }
            }
            if (!bgmStarted) {
                try {
                    AUDIO.bgm.loop = true;
                    AUDIO.bgm.play().catch(() => {});
                } catch(err) {}
                bgmStarted = true;
            }
        });

        let gameStartTime = Date.now();
        let playCount = parseInt(localStorage.getItem('wc_playCount') || '0');
        let highScore = parseInt(localStorage.getItem('wc_highScore') || '0');

        function updatePlayTime() {
            if (!isPaused) {
                const seconds = Math.floor((Date.now() - gameStartTime) / 1000);
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = seconds % 60;
                document.getElementById('playTime').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
            }
            requestAnimationFrame(updatePlayTime);
        }

        function startGame() {
            gameStartTime = Date.now();
            playCount++;
            localStorage.setItem('wc_playCount', playCount);
            document.getElementById('playCount').textContent = playCount;
            updatePlayTime();
            spawnEnemies();
            document.getElementById('inputArea').focus();
        }

        function updateScore(basePoints) {
            const comboBonus = 1 + Math.floor(combo / 5) * 0.25;
            const finalPoints = Math.floor(basePoints * comboBonus);
            score += finalPoints;

            document.getElementById('currentScore').textContent = score;
            document.getElementById('scoreText').textContent = score;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('wc_highScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
        }

        function gameOver() {
            isPaused = true;
            if (window.VelvetAlert) {
                VelvetAlert(`最终分数: ${score} \n最高得分: ${highScore} \n最高连击: ${maxCombo}`, 'MISSION OVER // 游戏结束', () => {
                    location.reload();
                });
            } else {
                alert(`最终分数: ${score}\n最高得分: ${highScore}\n最高连击: ${maxCombo}`);
                location.reload();
            }
        }

        document.getElementById('playCount').textContent = playCount;
        document.getElementById('highScore').textContent = highScore;

        window.onload = () => {
            startGame();
        };
    </script>
</body>
</html>
