<!DOCTYPE html>
<html lang="zh-CN">
<head>

          hm.src = "https://hm.baidu.com/hm.js?5cb8cf2e475ade0241293a6b3ac8886f";

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SNAKE | 贪吃蛇街机挑战</title>
    <link rel="icon" href="../../../hund.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../velvet-theme.css">
    <script src="../../velvet-nav.js" data-root="../../../index.html"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px 16px 32px;
            background:
                radial-gradient(circle at top, rgba(230, 0, 18, 0.18), transparent 35%),
                #101010;
            color: #F2F2F2;
            font-family: "Anton", "Noto Sans SC", sans-serif;
        }

        .back-link {
            position: fixed;
            top: 16px;
            left: 16px;
            color: #F2F2F2;
            text-decoration: none;
            border: 2px solid #fff;
            padding: 8px 14px;
            background: #101010;
            transform: skewX(-8deg);
            transition: background 0.2s, color 0.2s;
        }

        .back-link:hover {
            background: #E60012;
            color: #fff;
        }

        header {
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3.5rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 span {
            color: #E60012;
        }

        .subtitle {
            margin-top: 8px;
            color: #aaa;
            font-size: 0.95rem;
            letter-spacing: 0.12em;
        }

        .panel {
            width: min(92vw, 420px);
            border: 3px solid #fff;
            background: #101010;
            box-shadow: 8px 8px 0 #E60012;
            position: relative;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 2px solid #fff;
            font-size: 1.1rem;
            letter-spacing: 0.06em;
        }

        .stats strong {
            color: #E60012;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            touch-action: none;
            cursor: pointer;
        }

        .overlay {
            position: absolute;
            inset: 52px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(16, 16, 16, 0.82);
            text-align: center;
            padding: 20px;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            margin: 0;
            font-size: 2rem;
            color: #E60012;
        }

        .overlay p {
            margin: 0;
            color: #ddd;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .controls {
            width: min(92vw, 420px);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .controls button,
        #startBtn {
            border: 2px solid #fff;
            background: #101010;
            color: #fff;
            padding: 12px;
            font: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
        }

        .controls button:hover,
        #startBtn:hover {
            background: #E60012;
            transform: translateY(-2px);
        }

        .controls .empty {
            visibility: hidden;
        }

        #startBtn {
            width: min(92vw, 420px);
        }

        .hint {
            max-width: 420px;
            text-align: center;
            color: #888;
            font-size: 0.85rem;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="velvet-bg-effects">
        <div class="glow-spot"></div>
        <div class="glow-spot-2"></div>
        <div class="stripe-1"></div>
        <div class="stripe-2"></div>
        <div class="stripe-3"></div>
        <div class="halftone" style="position:absolute; inset:0; opacity:0.18;"></div>
    </div>

    <header>
        <h1><span>贪吃蛇</span> SNAKE</h1>
        <p class="subtitle">街机领域 · ARCADE</p>
    </header>

    <div class="panel">
        <div class="stats">
            <div>得分 <strong id="score">0</strong></div>
            <div>最高 <strong id="highScore">0</strong></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400" aria-label="贪吃蛇游戏画布"></canvas>
        <div id="overlay" class="overlay">
            <h2 id="overlayTitle">贪吃蛇</h2>
            <p id="overlayHint">方向键 / WASD 移动 · 空格开始</p>
        </div>
    </div>

    <div class="controls" aria-label="方向控制">
        <div class="empty"></div>
        <button type="button" data-dir="up">↑</button>
        <div class="empty"></div>
        <button type="button" data-dir="left">←</button>
        <button type="button" data-dir="down">↓</button>
        <button type="button" data-dir="right">→</button>
    </div>

    <button id="startBtn" type="button">开始游戏</button>

    <p class="hint">
        键盘：方向键或 WASD 移动，空格开始/暂停，P 暂停。<br>
        手机：滑动屏幕控制方向，点击画布开始。
    </p>

    <script src="game.js"></script>
</body>
</html>
