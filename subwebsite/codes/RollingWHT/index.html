<!DOCTYPE html>
<html lang="zh-CN">
  <head>

          var hm = document.createElement("script");
          hm.src = "https://hm.baidu.com/hm.js?5cb8cf2e475ade0241293a6b3ac8886f";

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>ROLLING WHT | 滚动的洪特</title>
    <link rel="icon" href="../../../hund.ico" type="image/x-icon">

    <!-- Unified Velvet Room Theme -->
    <link rel="stylesheet" href="../../velvet-theme.css">
    <script src="../../velvet-nav.js" data-root="../../../index.html"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: var(--phantom-black);
        color: #ffffff;
        font-family: var(--font-sans);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
      }

      .game-wrapper {
        position: relative;
        z-index: 10;
        margin: 20px auto 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 980px;
        padding: 0 10px;
        box-sizing: border-box;
      }

      #unity-canvas {
        width: min(960px, 94vw);
        height: min(600px, 58vw);
        background: #231F20;
        border: 4px solid #ffffff;
        box-shadow: 8px 8px 0px 0px var(--phantom-red);
        display: block;
      }

      .instructions {
        margin-top: 16px;
        background: var(--phantom-black);
        border: 2px solid #ffffff;
        box-shadow: 4px 4px 0px 0px var(--phantom-red);
        padding: 10px 24px;
        font-family: var(--font-display);
        font-size: 16px;
        letter-spacing: 1px;
        color: #ffffff;
        transform: skewX(-8deg);
      }

      .instructions span {
        color: var(--phantom-red);
      }
    </style>
  </head>
  <body>
    <div class="velvet-bg-effects">
      <div class="glow-spot"></div>
      <div class="glow-spot-2"></div>
      <div class="stripe-1"></div>
      <div class="stripe-2"></div>
      <div class="stripe-3"></div>
      <div class="halftone" style="position:absolute; inset:0; opacity:0.18;"></div>
    </div>

    <div class="game-wrapper">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div class="instructions">
        <span>CONTROLS:</span> 移动：WASD 或 方向键 | 开始：K
      </div>
    </div>

    <script src="Build/WHT.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "auto";
        canvas.style.aspectRatio = "960/600";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/WHT.data",
        frameworkUrl: "Build/WHT.framework.js",
        codeUrl: "Build/WHT.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "RollingWHT_枣园巷大冒险",
        productVersion: "0.1",
      });
    </script>
  </body>
</html>
