<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>ROLLING WHT 4399 | 滚动的洪特 风格化版</title>
    <link rel="icon" href="../../../hund.ico" type="image/x-icon">

    <!-- Unified Velvet Room Theme -->
    <link rel="stylesheet" href="../../velvet-theme.css">
    <script src="../../velvet-nav.js" data-root="../../../index.html"></script>

    <style>
        body {
            text-align: center;
            padding: 0;
            margin: 0;
            background: url('BG.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Comic Sans MS', var(--font-sans), sans-serif;
            color: #FFFFFF;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .game-zone {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            margin: 16px auto 40px;
            padding: 0 10px;
        }

        h1.tip-banner {
            font-size: 20px;
            color: yellow;
            background-color: rgba(230, 0, 18, 0.85);
            padding: 8px 16px;
            margin: 14px auto;
            width: 80%;
            border: 3px solid #ffcc00;
            box-shadow: 4px 4px 0px #000;
            font-family: var(--font-sans);
        }

        #unity-canvas {
            width: min(960px, 92vw);
            height: min(600px, 57vw);
            background: #231F20;
            border: 8px solid #ff0000;
            box-shadow: 0px 0px 20px #00ff00, inset 0px 0px 10px #00ff00;
            margin: 10px auto;
            display: block;
        }

        .advert {
            position: fixed;
            top: 70px;
            left: 10px;
            width: 160px;
            height: 520px;
            background: url('ad.jpg') no-repeat center center;
            background-size: contain;
            border: 4px solid #00ffcc;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.5;
            padding: 10px;
            box-shadow: 0px 0px 10px #000;
            z-index: 50;
        }

        .advert2 {
            position: fixed;
            top: 70px;
            right: 10px;
            width: 160px;
            height: 520px;
            background: url('ad.jpg') no-repeat center center;
            background-size: contain;
            border: 4px solid #cc00ff;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.5;
            padding: 10px;
            box-shadow: 0px 0px 10px #000;
            z-index: 50;
        }

        @media (max-width: 1300px) {
            .advert, .advert2 {
                display: none;
            }
        }
    </style>
  </head>
  <body>
    <div class="advert">4399怀旧区<br>经典小游戏</div>
    <div class="advert2">广告推广位<br>枣园巷大冒险</div>

    <div class="game-zone">
        <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
        <h1 class="tip-banner">操作提示：移动：WASD 或 方向键 | 开始：K</h1>
        <h1 class="tip-banner" style="font-size:14px; line-height:1.6; text-align:left; font-weight:normal; width:90%;">
            <strong>游戏简介：</strong>《RollingWHT：枣园巷大冒险》是一款充满奇幻色彩的网页小游戏，跟随主角WHT在神秘的枣园巷展开一场刺激的冒险，收集宝藏，解锁关卡，努力成为世界大明星！
        </h1>
    </div>

    <script src="Build/WHT.loader.js"></script>
    <script>
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);

            var canvas = document.querySelector("#unity-canvas");
            canvas.style.width = "100%";
            canvas.style.height = "auto";
            canvas.style.aspectRatio = "960/600";
        }

        createUnityInstance(document.querySelector("#unity-canvas"), {
            dataUrl: "Build/WHT.data",
            frameworkUrl: "Build/WHT.framework.js",
            codeUrl: "Build/WHT.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "RollingWHT_枣园巷大冒险",
            productVersion: "0.1",
        });
    </script>
</body>
</html>
