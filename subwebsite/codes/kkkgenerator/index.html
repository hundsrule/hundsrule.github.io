<!DOCTYPE html>
<html lang="zh-CN">
<head>

          hm.src = "https://hm.baidu.com/hm.js?f800252a358bc38fb9ce4cebe8e0c380";

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKK GENERATOR | 字符替换与重构</title>
    <link rel="icon" href="../../../hund.ico" type="image/x-icon">

    <!-- Unified Velvet Room Theme -->
    <link rel="stylesheet" href="../../velvet-theme.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="velvet-bg-effects">
        <div class="glow-spot"></div>
        <div class="glow-spot-2"></div>
        <div class="stripe-1"></div>
        <div class="stripe-2"></div>
        <div class="stripe-3"></div>
        <div class="halftone" style="position:absolute; inset:0; opacity:0.18;"></div>
    </div>

    <!-- Unified Velvet Room Nav Script -->
    <script src="../../velvet-nav.js" data-root="../../../index.html"></script>

    <div class="container">
        <h1>TEXT REFACTOR // 文本替换器</h1>

        <div class="section">
            <label class="label" for="sampleText">SAMPLE CORPUS // 选择示例文本</label>
            <select id="sampleText" onchange="setSampleText()">
                <option value="你说的对，但是《原神》是由米哈游自主研发的一款全新开放世界冒险游戏。游戏发生在一个被称作「提瓦特」的幻想世界，在这里，被神选中的人将被授予「神之眼」，导引元素之力。你将扮演一位名为「旅行者」的神秘角色，在自由的旅行中邂逅性格各异、能力独特的同伴们，和他们一起击败强敌">原神1 (神之眼)</option>
                <option value="我只想说一件事，倘若有一天原神真的消失，你们会高兴开心吗？对我来说，原神不仅仅是一款游戏，我玩的时间不是很长，毕竟不是开服玩家，只玩了一年的时间。这游戏就像是，在我不太完美的人生中，照来了一束光，我并不想让这束光消失，因为它如今已经渐渐的成为我坚持活下去的理由之一。">原神2 (一束光)</option>
                <option value="后方是这样的。前线的将士只要全身心投入到战场中，听命行事，奋力杀敌就可以，可是后方人员要考虑的事情就很多了。">鸣潮 (后方)</option>
                <option value="绫华最可爱了…最喜欢绫华了…嘿嘿嘿我的绫华酱……我已经离不开绫华了……世界上怎么会有绫华这么完美的人…我最喜欢绫华酱了！…我像个笨蛋一样喜欢她…一直、一直都在忍受着对绫华的爱…我的心里一直都是绫华！我爱绫华我真的真的真的很喜欢绫华…">神里绫华 (深情赞美)</option>
            </select>
        </div>

        <div class="section">
            <label class="label" for="inputText">INPUT SOURCE // 输入待处理文本</label>
            <textarea id="inputText" rows="4" placeholder="在此输入需要处理的文本..."></textarea>
        </div>

        <div class="section">
            <label class="label">TRANSFORM MODE // 替换模式</label>
            <div class="mode-tabs">
                <button class="mode-btn active" id="modeRandom" onclick="switchMode('random')">RANDOM // 随机替换</button>
                <button class="mode-btn" id="modeFind" onclick="switchMode('find')">FIND // 查找替换</button>
            </div>
        </div>

        <div id="randomOptions" class="section options-panel">
            <div class="option-row">
                <div class="option-item">
                    <label class="label-sm" for="replaceChar">替换为 (字符)</label>
                    <input type="text" id="replaceChar" maxlength="1" value="K">
                </div>
                <div class="option-item">
                    <label class="label-sm" for="replaceRatio">替换比例 (0 ~ 1)</label>
                    <input type="number" id="replaceRatio" step="0.01" min="0" max="1" value="0.2">
                </div>
            </div>
            <div class="option-row">
                <div class="option-item full">
                    <label class="label-sm">滑块快速调节</label>
                    <input type="range" id="replaceSlider" step="0.01" min="0" max="1" value="0.2">
                </div>
                <div class="option-item narrow">
                    <label class="label-sm">&nbsp;</label>
                    <button class="btn btn-secondary" onclick="generateRandomRatio()">随机比例</button>
                </div>
            </div>
        </div>

        <div id="findOptions" class="section options-panel hidden">
            <div class="option-row">
                <div class="option-item">
                    <label class="label-sm" for="findChar">查找字符</label>
                    <input type="text" id="findChar" maxlength="1" value="的">
                </div>
                <div class="option-item">
                    <label class="label-sm" for="replaceWith">替换为</label>
                    <input type="text" id="replaceWith" maxlength="1" value="K">
                </div>
            </div>
            <div class="option-row">
                <div class="option-item">
                    <label class="label-sm" for="findMode">替换方式</label>
                    <select id="findMode">
                        <option value="all">全部替换</option>
                        <option value="ratio">按比例随机替换</option>
                    </select>
                </div>
                <div class="option-item" id="findRatioGroup">
                    <label class="label-sm" for="findRatio">比例</label>
                    <input type="number" id="findRatio" step="0.1" min="0" max="1" value="0.5">
                </div>
            </div>
        </div>

        <div class="section btn-group">
            <button class="btn btn-primary" onclick="replaceText()">EXECUTE // 执行替换</button>
            <button class="btn btn-success" onclick="copyResult()">COPY // 复制结果</button>
            <button class="btn btn-danger" onclick="clearAll()">CLEAR // 清空</button>
        </div>

        <div class="section">
            <div class="result-header">
                <span class="label">OUTPUT RESULT // 替换结果</span>
                <span class="badge" id="statsBadge">0 / 0</span>
            </div>
            <textarea id="outputText" rows="5" placeholder="替换后的文本将显示在这里..." readonly></textarea>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
