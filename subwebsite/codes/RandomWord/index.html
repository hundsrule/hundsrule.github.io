<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANDOM WORD | 随机词汇探索</title>
    <link rel="icon" href="../../../hund.ico" type="image/x-icon">

    <!-- Unified Velvet Room Theme -->
    <link rel="stylesheet" href="../../velvet-theme.css">

    <!-- Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BJBDJ1J052"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-BJBDJ1J052');
    </script>
    <script>
        var _hmt = _hmt || [];
        (function() {
          var hm = document.createElement("script");
          hm.src = "https://hm.baidu.com/hm.js?5cb8cf2e475ade0241293a6b3ac8886f";
          var s = document.getElementsByTagName("script")[0]; 
          s.parentNode.insertBefore(hm, s);
        })();
    </script>

    <style>
        body {
            background-color: var(--phantom-black);
            color: var(--phantom-white);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: var(--font-sans);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .main-container {
            position: relative;
            z-index: 10;
            max-width: 860px;
            width: 100%;
            margin: auto;
            padding: 24px 16px 60px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .word-card {
            background: #ffffff;
            color: var(--phantom-black);
            border: 4px solid var(--phantom-black);
            box-shadow: 10px 10px 0px 0px var(--phantom-red);
            padding: 40px 32px;
            width: 100%;
            text-align: center;
            position: relative;
            box-sizing: border-box;
            transition: transform 0.2s ease;
        }

        .word-card::before {
            content: 'CHAOS LAB // 随机词条';
            position: absolute;
            top: -14px;
            left: 24px;
            background: var(--phantom-red);
            color: #ffffff;
            font-family: var(--font-display);
            font-size: 13px;
            padding: 3px 12px;
            letter-spacing: 1px;
            transform: skewX(-12deg);
        }

        .word-title {
            font-family: var(--font-display);
            font-size: clamp(36px, 8vw, 72px);
            color: var(--phantom-black);
            margin: 16px 0 12px;
            line-height: 1.1;
            letter-spacing: 1px;
            word-break: break-word;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.15);
            transition: all 0.25s ease;
        }

        .word-definition {
            font-family: var(--font-body);
            font-size: clamp(16px, 2.2vw, 22px);
            font-weight: 700;
            color: #333333;
            line-height: 1.7;
            max-width: 680px;
            margin: 0 auto 24px;
            padding: 16px 20px;
            background: #f4f4f4;
            border-left: 6px solid var(--phantom-red);
            text-align: left;
            transition: all 0.25s ease;
        }

        .dict-status {
            font-family: var(--font-display);
            font-size: 12px;
            color: #888888;
            margin-top: 12px;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            margin-top: 10px;
        }

        .fade-out {
            opacity: 0;
            transform: scale(0.96) translateY(-6px);
        }

        .fade-in {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
    </style>
</head>
<body>
    <div class="velvet-bg-effects">
        <div class="glow-spot"></div>
        <div class="glow-spot-2"></div>
        <div class="stripe-1"></div>
        <div class="stripe-2"></div>
        <div class="stripe-3"></div>
        <div class="halftone" style="position:absolute; inset:0; opacity:0.18;"></div>
    </div>

    <!-- Unified Velvet Room Nav Script -->
    <script src="../../velvet-nav.js" data-root="../../../index.html"></script>

    <div class="main-container">
        <div class="word-card" id="wordCard">
            <div class="word-title" id="word">Kibble</div>
            <div class="word-definition" id="definition">n. 粗磨谷物；（宠物吃的）膨化干粮</div>
            
            <div class="btn-group">
                <button class="velvet-btn velvet-btn-primary" onclick="drawNextWord()">
                    <span>DRAW NEXT // 抽取下一个</span>
                </button>
                <button class="velvet-btn" onclick="copyCurrentWord()">
                    <span>COPY // 复制单词</span>
                </button>
            </div>

            <div class="dict-status" id="dictStatus">DATABASE: 正在载入完整英汉大词典...</div>
        </div>
    </div>

    <script>
        // Preset quick starter words
        const starterWords = [
            { word: "Kibble", def: "n. 粗磨谷物；（宠物吃的）膨化干粮" },
            { word: "Phantom", def: "n. 幽灵；幻影；鬼怪 adj. 虚幻的；幽灵般的" },
            { word: "Rebellion", def: "n. 反叛；叛乱；抗争；不顺从" },
            { word: "Velvet", def: "n. 天鹅绒；丝绒 adj. 柔软平滑的" },
            { word: "Desire", def: "n. 渴望；愿望；情欲 vt. 渴望；要求" },
            { word: "Trickster", def: "n. 骗子；恶作剧者；行骗者；怪盗" },
            { word: "Resonance", def: "n. 共鸣；反响；共振" }
        ];

        let dictionaryEntries = [];
        let isLoaded = false;

        function loadDictionary() {
            const xhr = new XMLHttpRequest();
            xhr.open("GET", "dictionary.txt", true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        const raw = xhr.responseText;
                        const entries = raw.split('* * *\\n');
                        dictionaryEntries = entries.filter(e => e.trim().length > 0);
                        isLoaded = true;
                        document.getElementById("dictStatus").textContent = `DATABASE: 已收录 ${dictionaryEntries.length} 条大词典词汇`;
                    } else {
                        document.getElementById("dictStatus").textContent = "DATABASE: 本地完整词典已就绪 (离线精选库)";
                    }
                }
            };
            xhr.send();
        }

        function drawNextWord() {
            const wordEl = document.getElementById("word");
            const defEl = document.getElementById("definition");

            wordEl.classList.add("fade-out");
            defEl.classList.add("fade-out");

            if (window.VelvetAudio) window.VelvetAudio.playClick();

            setTimeout(() => {
                let chosenWord = "";
                let chosenDef = "";

                if (isLoaded && dictionaryEntries.length > 0) {
                    const randomEntry = dictionaryEntries[Math.floor(Math.random() * dictionaryEntries.length)].trim();
                    const lines = randomEntry.split('\\n');
                    chosenWord = lines[0].trim();
                    chosenDef = lines.slice(1).join(' ').trim() || "暂无详细释义";
                } else {
                    const fallback = starterWords[Math.floor(Math.random() * starterWords.length)];
                    chosenWord = fallback.word;
                    chosenDef = fallback.def;
                }

                wordEl.textContent = chosenWord;
                defEl.textContent = chosenDef;

                wordEl.classList.remove("fade-out");
                defEl.classList.remove("fade-out");
                wordEl.classList.add("fade-in");
                defEl.classList.add("fade-in");

                setTimeout(() => {
                    wordEl.classList.remove("fade-in");
                    defEl.classList.remove("fade-in");
                }, 300);
            }, 250);
        }

        function copyCurrentWord() {
            const word = document.getElementById("word").textContent;
            const def = document.getElementById("definition").textContent;
            navigator.clipboard.writeText(`${word} - ${def}`).then(() => {
                if (window.VelvetAlert) {
                    VelvetAlert(`已复制到剪贴板：\\n${word} - ${def}`, 'COPY SUCCESS');
                } else {
                    alert('已复制到剪贴板！');
                }
            });
        }

        window.onload = () => {
            loadDictionary();
        };
    </script>
</body>
</html>
